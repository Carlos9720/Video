<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Rosmina 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b1220;--bg2:#13213b;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
  --text:#eef3ff;--muted:#a9b6d3;--green:#25d366;--green2:#128c7e;--pink:#ff4fa3;--violet:#7c5cff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--text);overflow:hidden;
  background:radial-gradient(circle at 15% 10%,rgba(124,92,255,.45),transparent 40%),
             radial-gradient(circle at 85% 20%,rgba(255,79,163,.35),transparent 40%),
             radial-gradient(circle at 50% 100%,rgba(37,211,102,.30),transparent 45%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  display:grid;place-items:center;padding:16px}
.card{position:relative;z-index:2;width:100%;max-width:440px;text-align:center;background:var(--card);
  border:1px solid var(--line);border-radius:28px;padding:36px 24px;backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
.heart{font-size:72px;display:inline-block;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
h1{font-size:clamp(28px,8vw,40px);margin:10px 0 6px;font-weight:800;line-height:1.15;
  background:linear-gradient(90deg,#fff,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);margin:0 0 26px}
.btns{display:flex;gap:16px;justify-content:center;min-height:56px}
.btn{border:0;border-radius:16px;padding:14px 34px;font:700 18px Poppins,sans-serif;color:#fff;cursor:pointer;transition:transform .15s}
.yes{background:linear-gradient(135deg,var(--green),var(--green2));box-shadow:0 8px 26px rgba(37,211,102,.45)}
.yes:hover{transform:scale(1.08)}
.no{background:rgba(255,255,255,.1);border:1px solid var(--line);transition:left .25s,top .25s}
.no.run{position:fixed;z-index:5}
.final h1{font-size:clamp(30px,9vw,46px)}
.hidden{display:none}
.float{position:fixed;bottom:-60px;z-index:1;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="card" id="ask">
  <div class="heart">🥺</div>
  <h1>Perdóname,<br>te quiero mucho</h1>
  <p>¿Me perdonas?</p>
  <div class="btns">
    <button class="btn yes" id="yes">Sí 💖</button>
    <button class="btn no" id="no">No</button>
  </div>
</div>

<div class="card final hidden" id="final">
  <div class="heart">💖</div>
  <h1>Yo sé que me quieres, preciosa Rosmina</h1>
  <p>🥰 Gracias por perdonarme 🥰</p>
</div>

<script>
const no = document.getElementById('no');
const frases = ['¿Segura? 🥺','Piénsalo bien','¡No se puede! 😜','Ese botón no sirve','Dale al Sí 💖','Inténtalo otra vez 😏'];
let n = 0;
function huir(e){
  if (e) e.preventDefault();
  const r = no.getBoundingClientRect();
  no.classList.add('run');
  const maxX = window.innerWidth - r.width - 16, maxY = window.innerHeight - r.height - 16;
  no.style.left = Math.max(16, Math.random() * maxX) + 'px';
  no.style.top  = Math.max(16, Math.random() * maxY) + 'px';
  no.textContent = frases[n++ % frases.length];
}
no.addEventListener('mouseenter', huir);
no.addEventListener('touchstart', huir, {passive:false});
no.addEventListener('click', huir);

function lluvia(){
  const emojis = ['💖','💕','❤️','🌹','✨','💗'];
  for (let i = 0; i < 40; i++){
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'float';
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = (20 + Math.random() * 30) + 'px';
      s.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 6500);
    }, i * 120);
  }
}

document.getElementById('yes').onclick = () => {
  document.getElementById('ask').classList.add('hidden');
  no.classList.add('hidden');
  document.getElementById('final').classList.remove('hidden');
  lluvia(); setInterval(lluvia, 5000);
};
</script>
</body>
</html>
